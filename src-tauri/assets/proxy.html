<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>proxy 控制台</title>
<script>  try {
    var t = new URLSearchParams(location.search).get("theme");
    if (t !== "dark" && t !== "light") t = localStorage.getItem("zpool-theme");
    if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<style>
  :root{
    --bg:#0b0e13; --side:#0f131a; --card:#141a22; --card2:#111720; --line:#222a35; --line2:#1b222c;
    --fg:#e9eef6; --dim:#8b98ab; --dim2:#66738a; --hover:#171d26; --on:#1e2735;
    --acc:#5b86f7; --acc-soft:#16223c; --ok:#3ecf8e; --warn:#e8b34a; --err:#f2637a; --violet:#a78bfa;
    --shadow:none; --input:#0b0e13; --gap:14px;
  }
  :root[data-theme="light"]{
    --bg:#f5f6f8; --side:#ffffff; --card:#ffffff; --card2:#fafbfc; --line:#e4e7ec; --line2:#eef0f3;
    --fg:#1b2230; --dim:#5f6b7d; --dim2:#8b94a3; --hover:#f3f4f7; --on:#eef2fb;
    --acc:#2563eb; --acc-soft:#e8effd; --ok:#12915c; --warn:#a16207; --err:#d92d4b; --violet:#7c5cf0;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
    --input:#f7f8fa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font:13.5px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
       -webkit-font-smoothing:antialiased}
  .app{display:flex;height:100vh;overflow:hidden}

  
  aside{width:200px;flex:none;background:var(--side);border-right:1px solid var(--line);
        padding:14px 12px;display:flex;flex-direction:column;gap:3px;height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 16px}
  .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--violet));
        display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;flex:none}
  
  .brand-txt{display:flex;flex-direction:column;gap:3px;min-width:0;line-height:1.2}
  .brand b{font-size:14px;letter-spacing:.2px}
  .brand em{font-style:normal;font-size:10px;color:var(--dim2);border:1px solid var(--line);border-radius:5px;
            padding:1px 5px;align-self:flex-start;white-space:nowrap}
  .nav{display:flex;flex-direction:column;gap:1px}
  .nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--dim);
         text-decoration:none;font-size:13px;cursor:pointer;transition:background .12s,color .12s}
  .nav a:hover{background:var(--hover);color:var(--fg)}
  .nav a.on{background:var(--on);color:var(--fg);font-weight:500}
  .nav a.on .ico{color:var(--acc)}
  .ico{width:17px;height:17px;display:flex;align-items:center;justify-content:center;color:var(--dim2);flex:none}
  .ic{display:block;flex:none}
  .side-foot{margin-top:auto;padding:11px 9px 3px;border-top:1px solid var(--line2);font-size:11.5px;color:var(--dim2)}
  .side-foot .row{display:flex;align-items:center;gap:7px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim2);flex:none;transition:background .2s}
  .dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
  .dot.live{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}

  
  main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{flex:none;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
         backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
         padding:13px 24px;display:flex;align-items:center;gap:12px}
  header h1{font-size:16px;font-weight:600;letter-spacing:.2px}
  header .sub{color:var(--dim2);font-size:12px}
  .grow{flex:1}
  .pill{font-size:11.5px;color:var(--dim);border:1px solid var(--line);background:var(--card);
        border-radius:20px;padding:4px 11px;display:flex;align-items:center;gap:7px}
  .pill.live{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
  .ibtn{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:8px;
        width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
  .ibtn:hover{color:var(--fg);border-color:var(--dim2)}
  .wrap{padding:20px 24px 48px;width:100%;max-width:none;flex:1;min-height:0;overflow-y:auto}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:var(--gap);margin-bottom:var(--gap)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
  .card .lb{font-size:11.5px;color:var(--dim);margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .card .n{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.5px}
  .card .n small{font-size:12px;font-weight:400;color:var(--dim2);margin-left:4px;letter-spacing:0}
  .card .foot{font-size:11.5px;color:var(--dim2);margin-top:7px}
  .ex{font-size:10px;color:var(--dim2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Cascadia Mono",monospace}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  .panel + .panel{margin-top:var(--gap)}
  .panel h2{font-size:13px;font-weight:600;color:var(--fg);padding:11px 16px;min-height:46px;
            border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:9px}
  .panel .body{padding:15px 16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);align-items:start}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--gap);align-items:start}
  .grid3>.panel+.panel{margin-top:0}
  @media(max-width:960px){
    .grid2{grid-template-columns:1fr}
    aside{width:58px;padding:14px 8px}
    aside .lb,.brand-txt,.brand b,.brand em,.side-foot{display:none}
    .brand{justify-content:center;padding:6px 0 14px}
    .nav a{justify-content:center;gap:0;padding:9px 0}
    .ico{width:auto}
  }
  .kv{display:flex;align-items:baseline;gap:12px;padding:3.5px 0}
  .kv .k{color:var(--dim);width:84px;flex:none;font-size:12px}
  .kv .v{word-break:break-all;font-variant-numeric:tabular-nums}
  .copy{background:var(--input);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 10px;
        width:100%;font:12px/1.4 ui-monospace,Consolas,monospace;display:flex;align-items:center;gap:8px}
  .copy span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .copy input{flex:1;min-width:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:11.5px}
  
  .statusbar{display:flex;flex-wrap:wrap}
  .sb{flex:1 1 156px;min-width:0;padding:13px 16px;border-right:1px solid var(--line2);
      transition:background .12s}
  .sb:last-child{border-right:0}
  .sb.clickable{cursor:pointer}
  .sb.clickable:hover{background:var(--hover)}
  .sb-k{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--dim2);letter-spacing:.02em;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-go{display:inline-flex;color:var(--dim2);opacity:.7}
  .sb-v{margin-top:7px;font-size:20px;font-weight:600;line-height:1.15;letter-spacing:-.4px;
        font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-v small{font-size:11.5px;font-weight:400;color:var(--dim2);margin-left:3px;letter-spacing:0}
  .sb-v .ex{margin-left:4px}
  .sb-f{margin-top:6px;font-size:11px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:900px){ .sb{flex:1 1 46%} }

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--dim);font-weight:600;padding:8px 16px;border-bottom:1px solid var(--line2);
     font-size:11.5px;white-space:nowrap;background:var(--card2);position:sticky;top:0;z-index:2}
  td{padding:8px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:color-mix(in srgb,var(--acc) 9%,var(--hover))}
  .num{text-align:right;font-family:ui-monospace,SFMono-Regular,Consolas,"Cascadia Mono",monospace;
       font-variant-numeric:tabular-nums;white-space:nowrap}
  th.num{text-align:right}
  .scroll{max-height:380px;overflow:auto}
  
  .scroll.full{max-height:none;overflow:visible}
  .tscroll{overflow-x:auto}
  .tag{display:inline-block;font-size:10.5px;border-radius:5px;padding:1.5px 7px;border:1px solid transparent;white-space:nowrap;font-weight:500}
  .tag.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
  .tag.bad{color:var(--err);background:color-mix(in srgb,var(--err) 12%,transparent);border-color:color-mix(in srgb,var(--err) 28%,transparent)}
  .tag.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
  .tag.info{color:var(--acc);background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 28%,transparent)}
  .tag.mint{color:var(--violet);background:color-mix(in srgb,var(--violet) 14%,transparent);border-color:color-mix(in srgb,var(--violet) 28%,transparent)}
  .tag.dim{color:var(--dim2);background:var(--card2);border-color:var(--line)}
  .blank{color:var(--dim2);padding:26px 16px;text-align:center;font-size:12.5px}
  
  .empty{display:flex;flex-direction:column;align-items:center;gap:9px;padding:34px 16px;
         text-align:center;color:var(--dim2);font-size:12.5px;line-height:1.6}
  .empty svg{opacity:.45}
  .empty.breathe svg{animation:breathe 1.6s ease-in-out infinite}
  .empty.sm{flex-direction:row;justify-content:flex-start;gap:7px;padding:8px 0;font-size:12px}
  @keyframes breathe{0%,100%{opacity:.28}50%{opacity:1}}
  
  .btn,.mini{display:inline-flex;align-items:center;justify-content:center;gap:6px;
        height:28px;padding:0 12px;background:var(--on);border:1px solid var(--line);color:var(--dim);
        border-radius:7px;font:12px/1 inherit;cursor:pointer;text-decoration:none;white-space:nowrap;
        transition:background .12s,color .12s,border-color .12s}
  .btn:hover,.mini:hover{color:var(--fg);border-color:var(--dim2);background:var(--hover)}
  .btn:disabled,.mini:disabled{opacity:.45;cursor:default;border-color:var(--line);background:var(--on);color:var(--dim)}
  .btn:disabled:hover,.mini:disabled:hover{color:var(--dim);border-color:var(--line);background:var(--on)}
  
  .btn:not(:disabled):active,.mini:not(:disabled):active{transform:translateY(1px);
        background:color-mix(in srgb,var(--acc) 14%,var(--on));border-color:var(--dim2)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spin .ic{animation:spin .8s linear infinite}
  .btn.pri,.mini.pri{color:#fff;background:var(--acc);border-color:transparent}
  .btn.pri:hover,.mini.pri:hover{color:#fff;background:color-mix(in srgb,var(--acc) 86%,#000);border-color:transparent}
  .btn.danger,.mini.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 34%,var(--line))}
  .btn.danger:hover,.mini.danger:hover{color:#fff;background:var(--err);
        border-color:color-mix(in srgb,var(--err) 88%,#000)}
  .btn.on,.mini.on{color:var(--fg);border-color:var(--dim2);background:var(--hover)}
  .sel{background:var(--input);border:1px solid var(--line);color:var(--fg);border-radius:8px;
       padding:6px 10px;font:12.5px/1.4 inherit;min-width:180px;outline:none;max-width:100%}
  .sel:focus{border-color:var(--acc)}
  .sel.wide{min-width:230px;flex:1 1 230px;max-width:360px}
  .seg{display:inline-flex;background:var(--input);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
  .seg button{background:none;border:0;color:var(--dim);font:12.5px/1 inherit;padding:7px 13px;border-radius:6px;cursor:pointer;font-family:inherit;transition:background .12s,color .12s}
  .seg button:hover{color:var(--fg)}
  .seg button.on{background:var(--on);color:var(--fg);font-weight:500}

  canvas{width:100%;display:block}
  .bars{display:inline-flex;align-items:flex-end;gap:2px;height:18px}
  .bars i{width:4px;background:color-mix(in srgb,var(--ok) 70%,transparent);border-radius:1.5px;display:block;height:3px}
  .bars i.bad{background:color-mix(in srgb,var(--err) 75%,transparent);height:16px}
  .histo{display:flex;align-items:flex-end;gap:5px;height:74px;padding-top:6px}
  .histo .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
  .histo .b i{width:100%;background:var(--acc);border-radius:3px 3px 0 0;opacity:.85;min-height:2px;display:block}
  .histo .b span{font-size:10px;color:var(--dim2);white-space:nowrap}
  .histo .b em{font-size:10.5px;color:var(--dim);font-style:normal;font-variant-numeric:tabular-nums}
  .foot-note{color:var(--dim2);font-size:11.5px;padding:12px 16px;border-top:1px solid var(--line2);line-height:1.75}

  
  .sec{display:flex;align-items:center;gap:9px;margin:2px 0 10px;color:var(--dim2)}
  .sec:before{content:"//";font-family:ui-monospace,Consolas,monospace;color:var(--acc);opacity:.75;font-size:12px}
  .sec b{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
  .stat .top{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:600;letter-spacing:.08em;
             text-transform:uppercase;color:var(--dim2);font-family:ui-monospace,Consolas,monospace}
  .stat .top .ico{width:15px;height:15px}
  .stat .big{display:flex;align-items:baseline;gap:6px;margin-top:10px;font-size:27px;font-weight:600;
             letter-spacing:-.7px;font-variant-numeric:tabular-nums;font-family:ui-monospace,Consolas,monospace}
  .stat .big u{text-decoration:none;font-size:11.5px;font-weight:400;color:var(--dim2);letter-spacing:0}
  .stat .cap{margin-top:9px;font-size:10.5px;color:var(--dim2);font-family:ui-monospace,Consolas,monospace}
  .mini12{display:flex;align-items:flex-end;gap:2px;height:32px;margin-top:11px}
  .mini12 i{flex:1;border-radius:1.5px;min-height:3px;display:block}
  .secstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--gap)}
  .secstat .s{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:10px 13px}
  .secstat .s .k{font-size:11px;color:var(--dim2);letter-spacing:.03em}
  .secstat .s .v{margin-top:5px;font-size:17px;font-weight:600;font-family:ui-monospace,Consolas,monospace;
                 font-variant-numeric:tabular-nums;color:var(--fg)}
  .secstat .s .v u{text-decoration:none;font-size:11px;font-weight:400;color:var(--dim2);margin-left:3px}
  .seg{display:flex;gap:2px;flex:1 1 auto;min-width:90px}
  .seg i{flex:1;height:6px;border-radius:1px;background:color-mix(in srgb,var(--dim) 16%,transparent);display:block}
  .lim{display:flex;align-items:center;gap:12px;padding:7px 0}
  .lim .nm{width:118px;flex:none;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lim .pc{width:46px;flex:none;text-align:right;font-size:12px;font-family:ui-monospace,Consolas,monospace;
           font-variant-numeric:tabular-nums;color:var(--fg)}
  .lim .sub{width:150px;flex:none;font-size:11px;color:var(--dim2);font-family:ui-monospace,Consolas,monospace;
            text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:860px){ .lim .sub{display:none} }
  .pager{display:flex;align-items:center;gap:9px;padding:10px 16px;border-top:1px solid var(--line2);
         color:var(--dim2);font-size:11.5px;flex-wrap:wrap}
  .pager .grow{flex:1}
  .pill{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;border-radius:999px;padding:2px 9px;
        font-family:ui-monospace,Consolas,monospace}
  .pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
  .pill.bad{color:var(--err);background:color-mix(in srgb,var(--err) 14%,transparent)}
  
  .tk{display:inline-flex;flex-direction:column;gap:3px;line-height:1.3}
  .tk .l{display:inline-flex;align-items:center;gap:9px;font-family:ui-monospace,Consolas,monospace;
         font-variant-numeric:tabular-nums;white-space:nowrap}
  .tk .ar{font-style:normal;font-size:11.5px;width:9px;text-align:center;flex:none}
  .tk .in .ar{color:var(--ok)}
  .tk .out .ar{color:var(--violet)}
  .tk .ca{color:var(--acc);gap:7px}
  .tk .ca .ar{color:var(--acc);width:auto;font-size:11px}
  .tipbox{position:relative;display:inline-flex;align-items:center;color:var(--dim2);cursor:help;margin-left:8px;vertical-align:middle}
  .tipbox>span{display:inline-flex;width:13px;height:13px;border-radius:50%;border:1px solid var(--line);
               align-items:center;justify-content:center;font-size:9.5px;line-height:1;color:var(--dim2);background:var(--card2)}
  .tipbox>.pop{display:none;position:absolute;z-index:60;left:50%;bottom:calc(100% + 9px);transform:translateX(-50%);
    height:max-content;align-self:flex-start;
    background:var(--card);border:1px solid color-mix(in srgb,var(--dim2) 34%,var(--line));border-radius:10px;
    padding:10px 12px;min-width:212px;box-shadow:0 16px 40px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.06);
    white-space:nowrap;font-weight:400;text-align:left}
  .tipbox:hover>.pop,.tipbox:focus-within>.pop{display:block}
  .pop h5{margin:0 0 7px;font-size:11.5px;color:var(--fg);font-weight:600}
  .pop .r{display:flex;justify-content:space-between;gap:20px;padding:2.5px 0;font-size:11.5px;color:var(--dim)}
  .pop .r b{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600}
  .pop .hr{height:1px;background:var(--line2);margin:6px 0}
  .pop .r.tot b{color:var(--acc)}
  .tk-sum{margin-top:10px;font-size:11.5px;color:var(--dim);
          font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
  
  .modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);display:flex;align-items:center;
         justify-content:center;padding:24px;backdrop-filter:blur(2px)}
  .modal[hidden]{display:none}
  .mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;width:100%;max-width:620px;
        max-height:78vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.55);overflow:hidden}
  .mbox .mhd{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--line2)}
  .mbox .mhd b{font-size:13.5px}
  .msub{color:var(--dim2);font-size:11.5px}
  .mbox .mbody{padding:15px 16px;overflow:auto}

  
  .qbar{height:7px;border-radius:5px;background:var(--card2);border:1px solid var(--line);overflow:hidden;
        flex:1 1 80px;min-width:56px;display:block;transition:border-color .12s}
  .qbar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 55%,var(--violet)));
          transition:width .25s}
  .qbar.warn>i{background:var(--warn)}
  .qbar.danger>i{background:var(--err)}
  .qpct{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;
        font-family:ui-monospace,SFMono-Regular,Consolas,"Cascadia Mono",monospace;
        width:42px;text-align:right;flex:none}
  
  .q-row{display:flex;align-items:center;gap:8px;padding:3.5px 8px;margin:0 -8px;border-radius:7px;
         transition:background .12s}
  .q-row:hover{background:var(--hover)}
  .q-row:hover .qbar{border-color:var(--dim2)}

function bars(h) {
  const hist = (h && h.history) || [];
  if (!hist.length) return '<span style="color:var(--dim2)">—</span>';
  const max = Math.max(1, ...hist.map((x) => x.ms || 0));
  return '<span class="bars">' + hist.map((x) => x.ms == null
    ? '<i class="bad" title="失败"></i>'
    : '<i style="height:' + Math.max(3, Math.round((x.ms / max) * 16)) + 'px" title="' + x.ms + 'ms"></i>').join("") + "</span>";
}
function allLatency() {

function drawSpark() {
  const c = $("spark");
  if (!c) return;
  const cs = getComputedStyle(document.documentElement);
  const acc = cs.getPropertyValue("--acc").trim() || "#5b86f7";
  const dim = cs.getPropertyValue("--dim2").trim() || "#66738a";
  const dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = 64;
  if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const x = c.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, w, h);
  if (HIST.length < 2) {
    x.fillStyle = dim; x.font = "11px ui-monospace,monospace";
    x.fillText("还没有请求 —— 发一发就有了", 4, h / 2);
    return;
  }
  const max = Math.max(1, ...HIST);
  const px = (i) => (i / (HIST.length - 1)) * w;
  const py = (v) => h - 8 - (v / max) * (h - 20);
  const g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, acc + "55"); g.addColorStop(1, acc + "00");
  x.beginPath(); x.moveTo(0, h);
  HIST.forEach((v, i) => x.lineTo(px(i), py(v)));
  x.lineTo(w, h); x.closePath(); x.fillStyle = g; x.fill();
  x.beginPath();
  HIST.forEach((v, i) => (i ? x.lineTo(px(i), py(v)) : x.moveTo(px(i), py(v))));
  x.strokeStyle = acc; x.lineWidth = 1.8; x.lineJoin = "round"; x.stroke();
  x.fillStyle = dim; x.font = "10px ui-monospace,monospace";
  x.fillText(rate(max) + " tok/s", 4, 12);
}

function histogram() {
  const ms = allLatency().filter((v) => v != null);
  if (!ms.length) return emptyState("chan", "还没有探测数据 —— 到「渠道」页点「全部探测」");
  const B = [[0, 300], [300, 600], [600, 1000], [1000, 2000], [2000, Infinity]];
  const L = ["<300ms", "300-600", "600-1s", "1-2s", ">2s"];
  const counts = B.map(([a, b]) => ms.filter((v) => v >= a && v < b).length);
  const max = Math.max(1, ...counts);
  const p = (arr) => { arr.sort((x, y) => x - y); return arr.length ? arr[Math.floor(arr.length * 0.95)] : null; };
  const p95 = p(ms.slice());
  return '<div class="histo">' + counts.map((n, i) =>
    '<div class="b"><em>' + (n || "") + '</em><i style="height:' + Math.round((n / max) * 100) + '%"></i><span>' + L[i] + "</span></div>"
  ).join("") + "</div>" +
  '<div style="margin-top:10px;color:var(--dim2);font-size:11.5px">' + ms.length + " 次探测 · 中位 " +
  p(ms.slice()) + "ms · P95 " + (p95 == null ? "—" : p95) + "ms</div>";
}

function errDist() {
  const rel = LOGS.filter((l) => !NOISE.some((n) => l.includes(n)));
  if (!rel.length) return emptyState("list", "还没有日志");
  const K = ["成功", "风控", "限流", "取码", "失败", "其他"];
  const CL = { 成功: "ok", 风控: "bad", 限流: "warn", 取码: "mint", 失败: "bad", 其他: "dim" };
  const n = {}; K.forEach((k) => (n[k] = 0));
  for (const l of rel) n[lvl(l)[1]] = (n[lvl(l)[1]] || 0) + 1;
  const total = rel.length;
  return K.filter((k) => n[k]).map((k) => {
    const pct = Math.round((n[k] / total) * 100);
    return '<div style="margin-bottom:9px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">' +
      '<span class="tag ' + CL[k] + '">' + k + '</span><span class="grow"></span>' +
      '<span class="mono" style="color:var(--dim);font-size:11.5px">' + n[k] + " · " + pct + "%</span></div>" +
      '<div style="height:5px;background:var(--card2);border-radius:3px;overflow:hidden">' +
      '<div style="height:100%;width:' + pct + '%;background:var(--' + (CL[k] === "dim" ? "dim2" : CL[k]) + ');opacity:.8"></div></div></div>';
  }).join("");
}

function poolLat() {
  const all = (S && S.channels) || [];
  const xs = [];
  let probed = 0;
  for (const c of all) {
    const h = c.health || {};
    if (h.lastAt) probed++;
    for (const s of h.history || []) if (s && s.ms != null) xs.push(s.ms);
  }
  xs.sort((a, b) => a - b);
  const n = xs.length;
  const at = (p) => (n ? xs[Math.min(n - 1, Math.floor(p * (n - 1)))] : null);
  return {
    probed, all: all.length, n,
    avg: n ? Math.round(xs.reduce((a, b) => a + b, 0) / n) : null,
    med: at(0.5), p95: at(0.95), max: n ? xs[n - 1] : null,
  };
}

function poolLatRecent(n) {
  const all = (S && S.channels) || [];
  const pts = [];
  for (const c of all) {
    for (const s of (c.health || {}).history || []) {
      if (s && s.ms != null) pts.push({ at: s.at, ms: s.ms });
    }
  }
  pts.sort((a, b) => a.at - b.at);
  return pts.slice(-n).map((x) => x.ms);
}
function poolLatHtml() {
  const p = poolLat();
  const tile = (k, v, u, extra) => '<div class="s"><div class="k">' + esc(k) + '</div><div class="v">' +
    (v == null ? "—" : typeof v === "string" ? esc(v) : num(v)) + (v != null && u ? "<u>" + u + "</u>" : "") +
    "</div>" + (extra || "") + "</div>";

  const recent = poolLatRecent(12);
  const bars = recent.length ? miniBars(recent, "var(--ok)") : "";
  return '<div class="secstat" style="margin-bottom:var(--gap)">' +
    tile("平均延迟", p.avg, "ms", bars) +
    tile("中位数", p.med, "ms", bars) + tile("P95", p.p95, "ms") +
    tile("最慢一次", p.max, "ms") + tile("已探测号", p.probed + "/" + p.all, "") +
    tile("样本", p.n, "次探测") + "</div>";
}

function patchChan() {
  const s = S || {};
  const all = s.channels || [];
  const byId = new Map(all.map((c) => [c.id, c]));
  const want = all.filter((c) => {
    const h = c.health || {};
    if (chanFilter === "down") return c.frozen || (h.lastAt && h.lastMs == null);
    if (chanFilter === "frozen") return !!c.frozen;
    if (chanFilter === "untested") return !h.lastAt;
    return true;
  });
  const rows = document.querySelectorAll('[data-p="crow"]');

  if ([...rows].map((r) => r.dataset.id).join(",") !== want.map((c) => c.id).join(",")) { render(); return; }
  PT("chan-count", want.length + "/" + all.length + " · 每 90 秒自动探一个（带抖动）");
  for (const tr of rows) {
    const c = byId.get(tr.dataset.id);
    if (!c) continue;
    const h = c.health || {};
    const st = c.frozen ? ["bad", c.frozen]
      : !h.lastAt ? ["dim", "未探测"]
      : h.lastMs != null ? ["ok", "正常"] : ["bad", "不通"];
    const q = (n) => tr.querySelector('[data-p="c-' + n + '"]');
    const a = q("st"); if (a) a.innerHTML = '<span class="tag ' + st[0] + '">' + st[1] + "</span>";
    const b = q("ms"); if (b) b.textContent = h.lastMs == null ? "—" : h.lastMs + " ms";
    const d = q("bars"); if (d) d.innerHTML = bars(h);
    const e = q("rate"); if (e) e.textContent = h.rate == null ? "—" : h.rate + "%";
    const f = q("streak"); if (f) f.innerHTML = h.streak ? '<span style="color:var(--err)">' + h.streak + "</span>" : "0";
    const g = q("last"); if (g) g.textContent = h.lastAt ? hhmmss(h.lastAt) : "—";
    if (!!c.frozen !== !!tr.querySelector("[data-unfreeze]")) { render(); return; }   
  }

  const sig = ((S && S.channels) || []).map((c) => {
    const h = c.health || {};
    return [h.lastAt, h.lastMs, (h.history || []).length].join(":");
  }).join("|");
  if (sig !== POOL_LAT_SIG) { POOL_LAT_SIG = sig; PH("poolLat", poolLatHtml()); }
}

function lvl(line) {
  if (line.includes(" code=3012") || line.includes("blocked")) return ["bad", "风控"];
  if (line.includes("code=3009") || line.includes(" switch ")) return ["warn", "限流"];
  if (line.includes("probe-")) return ["info", "探测"];
  if (line.includes("mint") && (line.includes("mint +1") || line.includes("mint-retry") || line.includes("mint-load"))) return ["mint", "取码"];
  if (line.includes("external-ok") || line.includes(" ok ")) return ["ok", "成功"];
  if (line.includes("fail") || line.includes("error")) return ["bad", "失败"];
  if (line.includes("page-disk") || line.includes("已存在")) return ["dim", "调试"];
  if (line.includes("] start ") || line.includes("init ") || line.includes("loaded ")) return ["dim", "系统"];
  return ["dim", "其他"];
}
function logRel() {
  const all = LOGP.lines.slice().reverse();
  const rel = showAll ? all : all.filter((l) => !NOISE.some((n) => l.includes(n)));
  return { all, rel };
}
function logRowsHtml(rel) {
  return rel.map((l) => {
    const cls = lvl(l), t = l.slice(0, 19), rest = l.slice(20).replace(/^\[[a-z\-]+\] /, "");
    return '<tr><td class="mono" style="color:var(--dim2);white-space:nowrap">' + esc(t) +
      '</td><td><span class="tag ' + cls[0] + '">' + cls[1] + "</span></td>" +
      '<td class="mono" style="word-break:break-all">' + esc(rest) + "</td></tr>";
  }).join("");
}
function logStatsHtml(rel) {
  const n = (k) => rel.filter((l) => lvl(l)[1] === k).length;
  return '<span class="tag ok">成功 ' + n("成功") + "</span>" +
    '<span class="tag bad">风控 ' + n("风控") + "</span>" +
    '<span class="tag warn">限流 ' + n("限流") + "</span>" +
    '<span class="tag info">探测 ' + n("探测") + "</span>" +
    '<span class="tag mint">取码 ' + n("取码") + "</span>";
}
function logPageInfo(rel, all) {
  const limit = LOGP.limit, total = LOGP.total, page = LOGP.page;
  const pages = Math.max(1, Math.ceil(total / limit));
  const from = total === 0 ? 0 : page * limit + 1;
  const to = Math.min(total, page * limit + limit);
  return "第 " + (page + 1) + " / " + pages + " 页 · 共 " + num(total) +
    " 条 · 本页 " + from + "-" + to + (rel.length !== all.length ? "（过滤调试后 " + rel.length + " 条）" : "");
}
const LOGPAGER_STYLE = "display:flex;align-items:center;gap:6px;padding:11px 16px;border-top:1px solid var(--line2);flex-wrap:wrap";
function logPagerInner(rel, all) {
  const limit = LOGP.limit, total = LOGP.total, page = LOGP.page;
  const pages = Math.max(1, Math.ceil(total / limit));

  const nums = [];
  for (let p = Math.max(0, page - 2); p <= Math.min(pages - 1, page + 2); p++) nums.push(p);
  return '<button class="mini" data-logp="0"' + (page === 0 ? " disabled" : "") + '>' + ICON("chevronL", 14) + '首页</button>' +
    '<button class="mini" data-logp="' + (page - 1) + '"' + (page === 0 ? " disabled" : "") + '>' + ICON("chevronL", 14) + '上一页</button>' +
    nums.map((p) => '<button class="mini' + (p === page ? " on" : "") + '" data-logp="' + p + '">' + (p + 1) + "</button>").join("") +
    '<button class="mini" data-logp="' + (page + 1) + '"' + (page >= pages - 1 ? " disabled" : "") + '>下一页' + ICON("chevronR", 14) + '</button>' +
    '<button class="mini" data-logp="' + (pages - 1) + '"' + (page >= pages - 1 ? " disabled" : "") + '>末页' + ICON("chevronR", 14) + '</button>' +
    '<span class="grow"></span>' +
    '<span data-p="loginfo" style="color:var(--dim2);font-size:12px">' + logPageInfo(rel, all) + "</span>";
}
function wireLogPager() {
  for (const b of document.querySelectorAll("[data-logp]")) {
    b.onclick = () => { if (b.disabled) return; LOGP.page = Number(b.dataset.logp); loadLogs(); };
  }
}
function viewLogs() {

  const { all, rel } = logRel();
  const rows = logRowsHtml(rel);
  const limit = LOGP.limit;
  LOGP._pp = LOGP.page; LOGP._pg = Math.max(1, Math.ceil(LOGP.total / limit));

    '<div data-p="logpager" style="' + LOGPAGER_STYLE + '">' + logPagerInner(rel, all) + "</div>" +
    '<div class="body" data-p="logstats" style="border-bottom:1px solid var(--line2);padding:11px 16px;display:flex;gap:6px;flex-wrap:wrap">' +
    logStatsHtml(rel) + "</div>" +
    (rows ? '<div class="tscroll"><table><thead><tr><th>时间</th><th>类型</th><th>内容</th></tr></thead><tbody data-p="logrows">' + rows + "</tbody></table></div>"
          : emptyState("list", "这一页没有日志")) +
    "</div>";
}

function patchLogs() {
  if (route !== "logs") return;
  const { all, rel } = logRel();
  const tb = document.querySelector('[data-p="logrows"]');
  if (!!tb !== (rel.length > 0)) { render(); return; }   
  if (tb) tb.innerHTML = logRowsHtml(rel);
  PH("logstats", logStatsHtml(rel));
  const pages = Math.max(1, Math.ceil(LOGP.total / LOGP.limit));
  if (LOGP._pp !== LOGP.page || LOGP._pg !== pages) {
    const pg = P("logpager");
    if (pg) { pg.innerHTML = logPagerInner(rel, all); wireLogPager(); }
    LOGP._pp = LOGP.page; LOGP._pg = pages;
  } else {
    PT("loginfo", logPageInfo(rel, all));
  }
}

function idLabel(a) {
  const id = a.identity || {};
  return id.display_name || id.username || id.email || id.user_id || "—";
}
function accountName(id) {
  const a = (ACC && ACC.accounts || []).find((x) => x.id === id);
  return a ? a.name : id;
}

function fmtTok(n) {
  if (n == null) return "—";
  if (n >= 1e6) return (n / 1e6).toFixed(n % 1e6 === 0 ? 0 : 1) + "M";
  if (n >= 1e3) return Math.round(n / 1e3) + "K";
  return String(Math.round(n));
}
function pctUsed(it) {
  if (!it) return null;
  if (it.percent_used != null) return Math.min(100, Math.max(0, it.percent_used));
  if (it.total != null && it.total > 0 && it.remaining != null) {
    return Math.min(100, Math.max(0, (1 - it.remaining / it.total) * 100));
  }
  return null;
}

function qbarHtml(used, tip) {
  const cls = used == null ? "" : used >= 90 ? " danger" : used >= 70 ? " warn" : "";
  const rem = used == null ? 100 : 100 - used;
  const txt = used == null ? "--" : rem.toFixed(0) + "%";
  const tt = tip ? ' title="' + esc(tip) + '"' : "";
  return '<span class="qbar' + cls + '"' + tt + '><i style="width:' + rem + '%"></i></span><span class="qpct">' + txt + "</span>";
}

function quotaSrcKey(it) {
  const s = String((it && it.source_key) || "").trim();
  if (s) return s;
  return [((it && it.name) || "?"), (it && it.total) ?? "", (it && it.remaining) ?? "", (it && (it.reset || it.period_end)) || ""].join("|");
}
function quotaWinRank(it) {
  const w = String((it && it.window) || "").toLowerCase();
  if (w === "daily") return 50;
  if (w.startsWith("hours:")) return 40;
  if (w === "weekly") return 30;
  if (w === "monthly") return 20;
  return 10;
}

function dedupItems(items) {
  const best = new Map();
  for (const it of (items || [])) {
    const name = String(it.name || "?").trim() || "?";
    const k = name + "\u0000" + quotaSrcKey(it);
    const prev = best.get(k);
    if (!prev || quotaWinRank(it) > quotaWinRank(prev)) best.set(k, it);
  }
  return [...best.values()];
}
function byModel(items) {
  const out = new Map();
  for (const it of dedupItems(items)) {
    const name = String(it.name || "?").trim() || "?";
    let g = out.get(name);
    if (!g) { g = { name: name, remaining: 0, total: 0, used: 0, pctSum: 0, n: 0, end: "" }; out.set(name, g); }
    if (it.remaining != null) g.remaining += Number(it.remaining) || 0;
    if (it.total != null) g.total += Number(it.total) || 0;
    if (it.used != null) g.used += Number(it.used) || 0;
    if (it.percent_used != null) { g.pctSum += Number(it.percent_used) || 0; g.n += 1; }
    const e = it.period_end || it.reset || "";
    if (e && (!g.end || String(e) < String(g.end))) g.end = e;
  }
  return [...out.values()].sort((a, b) => (b.total || 0) - (a.total || 0));
}

function qrowHtml(g) {
  const used = g.n ? g.pctSum / g.n : (g.total > 0 && g.remaining != null ? (1 - g.remaining / g.total) * 100 : null);
  const nums = g.total != null && g.remaining != null ? fmtTok(g.remaining) + " / " + fmtTok(g.total) : "";
  const end = g.end || "";
  const tip = [g.name, nums ? "剩余 " + fmtTok(g.remaining) + " · 总量 " + fmtTok(g.total) : "",
    used != null ? "已用 " + used.toFixed(0) + "%" : "", end ? "到期 " + end : ""].filter(Boolean).join(" · ");
  return '<div class="q-row">' +
    '<span class="ql" title="' + esc(g.name) + '">' + esc(g.name) + "</span>" +
    qbarHtml(used, tip) +
    '<span class="qn" title="' + esc(tip) + '">' + esc(nums || "—") + "</span>" +
    '<span class="qr" title="' + esc(end) + '">' + esc(end) + "</span></div>";
}

function quotaRowsHtml(q) {
  if (!q || q.is_empty) return '<div style="color:var(--dim2);font-size:12px;padding:6px 0">没有额度数据</div>';
  let html = "";
  const head = (q.plans && q.plans[0]) || q;
  const tier = head.tier || q.plan_tier;

let __gaugeSeq = 0;
function gaugeSvg(pct, big, sub, cls, pctLabel) {
  cls = cls || ""; pctLabel = pctLabel || "";
  const uid = "geq" + (++__gaugeSeq);
  const isBig = /\bbig\b/.test(cls);
  const p = Math.max(0, Math.min(100, Number.isFinite(pct) ? pct : 0));
  const CX = 50, CY = 50, R = 36, START = 135, SWEEP = 270;
  const C = 2 * Math.PI * R;
  const ARC = (C * SWEEP) / 360;
  const keep = (ARC * p) / 100;
  const rad = (d) => (d * Math.PI) / 180;
  const pt = (d, rr) => [CX + rr * Math.cos(rad(d)), CY + rr * Math.sin(rad(d))];
  let ticks = "";
  if (isBig) {
    for (let i = 0; i <= 27; i++) {
      const d = START + (SWEEP * i) / 27;
      const major = i % 3 === 0;
      const a = pt(d, major ? 40.5 : 41.5), b = pt(d, major ? 45 : 43);
      ticks += '<line class="g-tick' + (major ? " major" : "") + '" x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) +
        '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) + '"/>';
    }
  }
  const endD = START + (SWEEP * p) / 100;
  const dash = (len) => 'stroke-dasharray="' + len.toFixed(1) + " " + C.toFixed(1) +
    '" transform="rotate(' + START + " " + CX + " " + CY + ')"';
  return '<svg viewBox="0 0 100 100" class="gauge' + (cls ? " " + cls : "") + '" role="img">' +
    '<defs><linearGradient id="' + uid + '" x1="0" y1="1" x2="1" y2="0">' +
      '<stop class="g-s0" offset="0"/><stop class="g-s1" offset="1"/></linearGradient></defs>' +
    ticks +
    '<circle class="g-track" cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke-width="7" stroke-linecap="round" ' + dash(ARC) + "/>" +
    '<circle class="g-halo" cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke-width="15" stroke-linecap="round" ' + dash(keep) + "/>" +
    '<circle class="g-fill" cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke="url(#' + uid + ')" stroke-width="7" stroke-linecap="round" ' + dash(keep) + "/>" +
    (p > 0.8 ? '<circle class="g-cap" cx="' + (CX + R) + '" cy="' + CY + '" r="2.6" style="transform:rotate(' + endD.toFixed(1) + 'deg)"/>' : "") +
    (pctLabel ? '<text class="g-pct" x="' + CX + '" y="' + (isBig ? 33 : 38) + '" text-anchor="middle">' + esc(pctLabel) + "</text>" : "") +
    '<text class="g-num" x="' + CX + '" y="' + (isBig ? 53 : 56) + '" text-anchor="middle">' + esc(big) + "</text>" +
    (sub ? '<text class="g-sub" x="' + CX + '" y="70" text-anchor="middle">' + esc(sub) + "</text>" : "") +
    "</svg>";
}

function quotaSummaryHtml() {
  return '<div class="panel" data-p="acct-summary">' + quotaSummaryInner() + "</div>";
}
function quotaSummaryInner() {
  let accounts = 0, empty = 0, failed = 0, loading = 0;
  const byModel = new Map();
  for (const id of Object.keys(QMAP)) {
    const q = QMAP[id];
    if (!q) continue;
    if (q.error) { failed++; continue; }
    if (!q.data) { loading++; continue; }        
    if (q.data.is_empty) { empty++; continue; }
    accounts++;

    for (const it of dedupItems(q.data.items)) {
      const k = it.name || "?";
      const m = byModel.get(k) || { total: 0, remaining: 0, hasT: false };
      if (it.total != null) {
        m.total += it.total;
        m.hasT = true;
        if (it.remaining != null) m.remaining += it.remaining;
      }
      byModel.set(k, m);
    }
  }
  const all = (ACC && ACC.accounts || []).length;
  const pending = Math.max(0, all - Object.keys(QMAP).length);

  const snap = (v) => (v >= 1e6 ? Math.round(v / 1e5) * 1e5 : v >= 1e3 ? Math.round(v / 1e3) * 1e3 : Math.round(v));
  let sumTotal = 0, sumRemain = 0;
  for (const m of byModel.values()) {
    if (!m.hasT) continue;
    sumTotal += snap(m.total);
    sumRemain += snap(m.remaining || 0);
  }
  const hasTotal = sumTotal > 0;
  const sumPct = hasTotal ? (sumRemain / sumTotal) * 100 : 100;
  const bigCls = " big" + (hasTotal ? (sumPct <= 10 ? " danger" : sumPct <= 30 ? " warn" : "") : "");
  const models = [...byModel.entries()]
    .sort((a, b) => (b[1].total || 0) - (a[1].total || 0))
    .slice(0, 8);
  const mgauges = models.map(([k, m]) => {
    const known = m.hasT && m.total > 0;
    const pct = known ? (m.remaining / m.total) * 100 : 100;
    const cls = known ? (pct <= 10 ? " danger" : pct <= 30 ? " warn" : "") : "";
    return '<div class="mgauge">' +
      gaugeSvg(pct, m.hasT ? fmtTok(m.remaining) : "—", m.hasT ? fmtTok(m.total) : "", cls,
        m.hasT ? Math.round(pct) + "%" : "") +
      '<span class="mgauge-name" title="' + esc(k) + '">' + esc(k) + "</span></div>";
  }).join("");

  const why = [];
  if (empty) why.push("空号 " + empty);
  if (failed) why.push('<span style="color:var(--err)">失败 ' + failed + "</span>");
  if (loading) why.push("查询中 " + loading);
  if (pending) why.push("待查 " + pending);
  const meta = "已查额度账号 " + accounts + " / " + all + " · 涉及模型 " + byModel.size;
  const hint = accounts ? (why.length ? "未计入：" + why.join(" · ") : "全部号都有额度") :
    '<div class="dash-hero-hint">点账号卡片上的「查询额度」，或上面的「查询全部额度」</div>';
  return "<h2>额度汇总 <span class=\"grow\"></span><span style=\"color:var(--dim2);font-weight:400\">" +
    (QLOAD.running ? "查询中 " + QLOAD.done + "/" + QLOAD.total : "所有号合计") + "</span></h2>" +
    '<div class="body"><div class="dash">' +
      '<div class="dash-hero">' +
        gaugeSvg(sumPct, hasTotal ? fmtTok(sumRemain) : "—", hasTotal ? fmtTok(sumTotal) : "", bigCls,
          hasTotal ? Math.round(sumPct) + "%" : "") +
        '<div class="dash-hero-txt">' +
          '<div class="dash-hero-lb">剩余 / 总量</div>' +
          '<div class="dash-hero-meta">' + esc(meta) + "</div>" + hint +
        "</div>" +
      "</div>" +
      '<div class="gauges">' +
        (mgauges || '<div class="dash-empty">' +
          (accounts ? "已查账号没有模型额度明细" : "还没有额度数据") + "</div>") +
      "</div>" +
      '<div class="acct-mid">' +
        '<div class="kv"><span class="k">账号数</span><span class="v">' + all + " 个</span></div>" +
        '<div class="kv"><span class="k">ZCode</span><span class="v" style="color:' +
          ((ACC && ACC.zcode_running) ? "var(--ok)" : "var(--dim)") + '">' +
          ((ACC && ACC.zcode_running) ? "运行中" : "未运行") + "</span></div>" +
        '<div class="acct-mid-act">' +
          '<button class="mini" data-acc-launch>' + ICON("play", 14) + "启动</button>" +
          '<button class="mini danger" data-acc-kill>' + ICON("close", 14) + "关闭</button>" +
        "</div>" +
      "</div>" +
      '<div class="due-card"><div class="due-hd">今天到期' +
        '<span class="grow"></span><span class="due-sub">按剩余 token</span></div>' +
        '<div data-p="due-today">' + dueTodayInner() + "</div></div>" +
    "</div></div>";
}

const EXP_BUCKETS = [
  { label: "已过期", cls: "bad" },
  { label: "今天到期", cls: "hot" },
  { label: "3 天内", cls: "warm" },
  { label: "更久", cls: "" }
];
function expDayDiff(end) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(end == null ? "" : end));
  if (!m) return null;
  const t = new Date(+m[1], +m[2] - 1, +m[3]);
  const n = new Date();
  return Math.round((t - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 864e5);
}
function expBucketOf(days) {
  if (days == null) return 3;   
  if (days < 0) return 0;
  if (days === 0) return 1;
  if (days <= 3) return 2;
  return 3;
}
function expiryBuckets() {
  const acc = EXP_BUCKETS.map(() => new Map());
  let accounts = 0;
  for (const id of Object.keys(QMAP)) {
    const q = QMAP[id];
    if (!q || !q.data || q.data.is_empty) continue;
    const items = q.data.items || [];
    if (!items.length) continue;
    accounts++;
    for (const it of dedupItems(items)) {
      const name = String(it.name || "?").trim() || "?";
      const b = expBucketOf(expDayDiff(it.period_end || it.reset));
      const m = acc[b].get(name) || { remaining: 0, total: 0 };
      if (it.remaining != null) m.remaining += Number(it.remaining) || 0;
      if (it.total != null) m.total += Number(it.total) || 0;
      acc[b].set(name, m);
    }
  }
  return { acc, accounts };
}

function dueTodayInner() {
  const { acc, accounts } = expiryBuckets();
  const ms = [...acc[1].entries()].sort((a, b) => (b[1].remaining || 0) - (a[1].remaining || 0));
  if (!ms.length) return '<div class="due-none">' + (accounts ? "今天没有到期的额度" : "还没有已查额度的号") + "</div>";
  const sum = ms.reduce((a, x) => a + (x[1].remaining || 0), 0);
  const rows = ms.map(([k, m]) => {
    const tip = k + " · 剩余 " + fmtTok(m.remaining) + (m.total ? " / 总量 " + fmtTok(m.total) : "");
    return '<div class="due-row"><span class="due-nm" title="' + esc(tip) + '">' + esc(k) +
      '</span><span class="due-v">' + esc(fmtTok(m.remaining)) + "</span></div>";
  }).join("");
  return '<div class="due-list">' + rows + "</div>" +
    '<div class="due-sum">' + ms.length + " 个模型 · " + esc(fmtTok(sum)) + "</div>";
}

async function api(url, body) {
  const opt = body === undefined
    ? { cache: "no-store" }
    : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(url, opt);
  let d = null;
  try { d = await r.json(); } catch (e) {}
  if (!r.ok || (d && d.error)) throw new Error((d && d.error) || ("HTTP " + r.status));
  return d;
}

async function loadQuota(id, quiet) {
  if (!quiet) QMAP[id] = { loading: true };
  if (route === "acct") patchAcct();
  try { QMAP[id] = { data: await api("/proxy/account/quota?id=" + encodeURIComponent(id)) }; }
  catch (e) { QMAP[id] = { error: String(e.message || e) }; }
  if (route === "acct") patchAcct();
}
async function loadAllQuotas() {
  if (QLOAD.running) return;
  const list = (ACC && ACC.accounts) || [];
  if (!list.length) return;
  QLOAD.running = true; QLOAD.done = 0; QLOAD.total = list.length;
  if (route === "acct") patchAcct();
  const queue = list.slice();

  const worker = async () => {
    while (queue.length) {
      const a = queue.shift();
      await loadQuota(a.id, true);
      QLOAD.done++;
      if (route === "acct") patchAcct();   
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  QLOAD.running = false;
  if (route === "acct") patchAcct();
}

function maybeAutoQuota() {
  if (QAUTO) return;
  const list = (ACC && ACC.accounts) || [];
  if (!list.length) return;
  const pending = list.filter((a) => !QMAP[a.id]);
  if (!pending.length) { QAUTO = true; return; }
  if (pending.length > 30) return;
  QAUTO = true;
  loadAllQuotas();
}

const CLAIM_POLL_MS = 1500;
const CLAIM_POLL_MAX = 40; 
async function claimSubmit(id, planId, planName) {
  CLAIM = { id, plan: planName || planId, running: true, msg: "正在领取…无感验证中，通常几秒就好，不用管", ok: null, startedAt: Math.floor(Date.now() / 1000) - 2 };
  if (route === "acct") render();
  try {
    const r = await api("/proxy/account/claim-start", { id, plan_id: planId, auto: true });
    CLAIM.running = true;
    CLAIM.msg = "正在领取（" + (r.account || "") + " · " + (r.plan || planName || "") + "）…无感验证中，通常几秒完成；若被风控拦会弹窗让你滑一下";
    if (route === "acct") render();
    pollClaim();
  } catch (e) {
    CLAIM = { id, msg: "领取没能开始：" + String(e.message || e), running: false, ok: false, startedAt: 0 };
    if (route === "acct") render();
  }
}
async function pollClaim() {
  for (let i = 0; i < CLAIM_POLL_MAX; i++) {
    await sleep(CLAIM_POLL_MS);
    let r = null;
    try { r = await fetch("/proxy/account/claim-result", { cache: "no-store" }).then((x) => x.json()); } catch (e) {}
    const res = r && r.result;
    if (res && res.accountId === CLAIM.id && (r.at || 0) >= CLAIM.startedAt) {
      if (res.ok === false) CLAIM = { id: CLAIM.id, msg: "领取失败：" + (res.message || "未知原因"), running: false, ok: false, startedAt: 0 };
      else CLAIM = { id: CLAIM.id, msg: "已领取：" + (res.planName || "") + (res.endsAt ? "（至 " + new Date(res.endsAt).toLocaleString("zh-CN", { hour12: false }) + "）" : ""), running: false, ok: true, startedAt: 0 };
      loadQuota(CLAIM.id, true);
      if (route === "acct") render();
      return;
    }
  }
  if (CLAIM.running) { CLAIM.running = false; CLAIM.msg = "等了约 60 秒还没结果 —— 可能被风控拦了，去工具窗口（exe 面板）看一眼有没有弹验证码；若已滑过，点「刷新额度缓存」或重新查额度看结果"; if (route === "acct") render(); }
}
async function loadLogs() {

  try {
    const d = await fetch("/proxy/logs?offset=" + (LOGP.page * LOGP.limit) + "&limit=" + LOGP.limit, { cache: "no-store" }).then((r) => r.json());
    LOGP.lines = d.lines || [];
    LOGP.total = d.total || 0;
    const pages = Math.max(1, Math.ceil(LOGP.total / LOGP.limit));
    if (LOGP.page > pages - 1) { LOGP.page = pages - 1; LOGP.loading = false; return loadLogs(); }
  } catch (e) {}
  LOGP.loading = false;
  if (route === "logs") patchLogs();   
}

function usageFail(r) {
  if (r.status >= 400) return true;
  const c = String(r.code || "").trim();
  return c !== "" && c !== "200" && c !== "0";
}

function abbr(n) {
  const a = Math.abs(Number(n) || 0);
  const f = (v, u) => [v.toFixed(a >= 1e10 ? 0 : 1).replace(/\.0$/, ""), u];
  if (a >= 1e9) return f(n / 1e9, "B");
  if (a >= 1e6) return f(n / 1e6, "M");
  if (a >= 1e4) return f(n / 1e3, "K");
  return [num(n), ""];
}

function miniBars(vals, color) {
  const mx = Math.max(1, ...vals);
  const last = Math.max(1, vals.length - 1);
  return '<div class="mini12">' + vals.map((v, i) =>
    '<i style="height:' + Math.max(3, Math.round((v / mx) * 100)) + "%;background:" + color +
    ";opacity:" + (0.28 + 0.66 * (i / last)).toFixed(2) + '"></i>').join("") + "</div>";
}

function segBar(frac, color, segs) {
  const n = segs || 24;
  let k = Math.round((Number(frac) || 0) * n);
  if (k < 0) k = 0;
  if (k > n) k = n;
  let h = "";
  for (let i = 0; i < n; i++) h += "<i" + (i < k ? ' style="background:' + color + '"' : "") + "></i>";
  return '<div class="seg">' + h + "</div>";
}

function tokCard(icon, label, o, cap) {
  const f = (v) => { const [n, u] = abbr(v || 0); return n + (u || ""); };
  const total = (o.in || 0) + (o.out || 0) + (o.cache || 0);
  const [tn, tu] = abbr(total);
  return '<div class="stat"><div class="top"><span class="ico">' + ICON(icon, 15) + "</span>" + esc(label) + "</div>" +
    '<div class="big">' + tn + (tu ? "<u>" + tu + "</u>" : "") + "</div>" +
    '<div class="tk-sum">输入: ' + f(o.in) + " / 输出: " + f(o.out) + " / 缓存: " + f(o.cache) + "</div>" +
    '<div class="cap">' + cap + "</div></div>";
}

function tokCell(r) {
  const i = r["in"] || 0, o = r.out || 0;

  const hasC = r.cache != null;
  const c = hasC ? Number(r.cache) || 0 : 0;
  const fc = hasC ? num(c) : "—";
  const tot = i + o + c;
  const f = (v) => num(v);
  return '<div class="tk">' +
    '<span class="l"><span class="in"><i class="ar">↓</i>' + f(i) + '</span>' +
      '<span class="out"><i class="ar">↑</i>' + f(o) + "</span></span>" +
    '<span class="l ca"><i class="ar">⛁</i>' + fc +

        '<div class="r"><span>输入 Token</span><b>' + f(i) + "</b></div>" +
        '<div class="r"><span>输出 Token</span><b>' + f(o) + "</b></div>" +
        '<div class="r"><span>缓存读取 Token</span><b>' + fc + "</b></div>" +
        '<div class="hr"></div>' +
        '<div class="r tot"><span>总 Token</span><b>' + (hasC ? f(tot) : "—") + "</b></div>" +
        (hasC ? "" : '<div class="r" style="color:var(--warn)">这条是加字段前的老记录</div>') +

function usageTopHtml() {
  const u = USAGE || {}, st = u.stats || {};
  const rows = u.rows || [];
  const t = st.total || { n: 0, in: 0, out: 0, fail: 0, avgTtfb: null, avgMs: null };
  const okN = Math.max(0, (t.n || 0) - (t.fail || 0));
  const rate = t.n ? okN / t.n : 0;
  const ttfbShare = t.avgMs ? Math.min(1, (t.avgTtfb || 0) / t.avgMs) : 0;
  const totTok = (t.in || 0) + (t.out || 0) + (t.cache || 0);
  const cacheShare = totTok ? (t.cache || 0) / totTok : 0;
  const scope = rows.length ? "明细载入 " + num(rows.length) + " 条" : "明细未载入";
  const cards = '<div class="secstat" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:var(--gap)">' +
    tokCard("usage", "今日 Token", st.today || {}, "今天 " + num((st.today || {}).n || 0) + " 次请求" +
      ((st.today || {}).fail ? " · 失败 " + num(st.today.fail) : "")) +
    tokCard("dash", "累计 Token", t, "共 " + num(t.n || 0) + " 次请求" +
      (t.fail ? " · 失败 " + num(t.fail) : "") + " · " + esc(scope)) +
    "</div>";

  const secstat = '<div class="secstat" style="margin-bottom:var(--gap)">' +
    [["平均首字节", [t.avgTtfb == null ? "—" : num(t.avgTtfb), "ms"]],
     ["平均总时长", t.avgMs == null ? ["—", ""] : [(t.avgMs / 1000).toFixed(1), "s"]],
     ["平均每发 token", [(t.n ? Math.round(totTok / t.n) : 0).toLocaleString("en-US"), ""]],
     ["成功率", [(rate * 100).toFixed(rate >= 0.9995 ? 0 : 1), "%"]]].map(([k, v]) =>
      '<div class="s"><div class="k">' + esc(k) + '</div><div class="v">' + v[0] + (v[1] ? "<u>" + esc(v[1]) + "</u>" : "") + "</div></div>").join("") +
    "</div>";

  const compose = '<div class="panel"><div class="body" style="padding:6px 16px 10px">' +
    [["成功率", rate, "var(--ok)", num(okN) + " 成功 / " + num(t.fail || 0) + " 失败"],
     ["缓存命中占比", cacheShare, "var(--acc)", num(t.cache || 0) + " 缓存 / " + num(totTok) + " 总 token"],
     ["首字节占比", ttfbShare, "var(--warn)", "首字节 " + (t.avgTtfb == null ? "—" : num(t.avgTtfb) + " ms") + " ÷ 整发 " + (t.avgMs == null ? "—" : (t.avgMs / 1000).toFixed(1) + " s")]].map(([nm, f, c, sub]) =>
      '<div class="lim"><span class="nm">' + esc(nm) + "</span>" + segBar(f, c, 24) +
      '<span class="pc">' + (f * 100).toFixed(1) + '%</span><span class="sub">' + esc(sub) + "</span></div>").join("") +
    "</div></div>";

  const lists = '<div class="grid3">' + [["按模型", st.byModel], ["按账号", st.byAcct], ["按 Key", st.byKey]].map(([title, arr]) => {
    const list = arr || [];
    const mx = Math.max(1, ...list.map((x) => (x.out || 0) + (x.in || 0) + (x.cache || 0)));
    const body = list.length ? list.slice(0, 8).map((x) => {
      const tk = (x.out || 0) + (x.in || 0) + (x.cache || 0);
      const f = (v) => { const [n, u] = abbr(v || 0); return n + (u || ""); };
      return '<div class="lim"><span class="nm mono" title="' + esc(x.k) + '">' +
        esc(x.k === "-" ? "未记录" : x.k || "—") + "</span>" +
        segBar(tk / mx, "var(--acc)", 20) +
        '<span class="pc mono">' + num(x.n) + "</span>" +
        '<span class="sub">' + f(x.in) + " in · " + f(x.out) + " out · " + f(x.cache) + " 缓存</span></div>";
    }).join("") : '<div class="blank">还没有数据</div>';
    return '<div class="panel"><h2>' + esc(title) + ' <span class="grow"></span>' +
      '<span style="color:var(--dim2);font-weight:400;font-size:11.5px">格长 = token 量 · 数字 = 请求数</span></h2>' +
      '<div class="body" style="padding:6px 16px 10px">' + body + "</div></div>";
  }).join("") + "</div>";

  return '<div class="sec"><b>概览</b></div>' + cards +
    '<div class="sec"><b>构成</b></div>' + secstat + compose +
    '<div class="sec" style="margin-top:var(--gap)"><b>分组</b></div>' + lists;
}
function viewUsage() {

function patchUsage(force) {
  if (route !== "usage" || !USAGE) return;
  const u = USAGE;
  const rows = u.rows || [];
  PT("usage-at", "更新于 " + hhmmss(Date.now()));
  PT("usage-count", rows.length + " / " + num(u.total || 0) + " 条");
  const sig = sigUsage();
  if (!force && sig === USAGE_SIG) return;
  USAGE_SIG = sig;
  PH("usageTop", usageTopHtml());
  const tb = document.querySelector('[data-p="usageRows"]');
  if (tb) {
    const sc = tb.closest(".scroll");
    const top = sc ? sc.scrollTop : 0;
    tb.innerHTML = usageRowsHtml();
    if (sc) sc.scrollTop = top;
  }
  if (pagerSig() !== PAGER_SIG) {
    PAGER_SIG = pagerSig();
    const pg = document.querySelector('[data-p="usagePager"]');
    if (pg) pg.innerHTML = usagePagerHtml();
  }
  wirePager();
}

async function loadUsage(force) {

  const q = new URLSearchParams({ limit: "1000" });
  if (UFILTER.acct.trim()) q.set("acct", UFILTER.acct.trim());
  if (UFILTER.model.trim()) q.set("model", UFILTER.model.trim());
  if (UFILTER.key.trim()) q.set("key", UFILTER.key.trim());
  if (UFILTER.fail) q.set("ok", "0");
  try {
    const [d, s] = await Promise.all([
      fetch("/proxy/usage?" + q.toString(), { cache: "no-store" }).then((r) => r.json()),
      fetch("/proxy/usage/stats", { cache: "no-store" }).then((r) => r.json()),
    ]);
    USAGE = { rows: d.rows || [], total: d.total || 0, stats: s || {} };
    if (route !== "usage") return;

    const os = usageOptsSig();
    if (os !== USAGE_OPTS_SIG) { USAGE_OPTS_SIG = os; render(); } else patchUsage(force);
  } catch (e) { rep("usage-throw", (e && (e.stack || e.message)) || e); }
}

function wirePager() {
  const size = $("upsize");
  if (size) size.onchange = () => { UPAGE.size = Number(size.value) || 25; UPAGE.page = 0; turnPage(0); };
  const nw = $("upnew");
  if (nw) nw.onclick = () => turnPage(UPAGE.page - 1);
  const od = $("upold");
  if (od) od.onclick = () => turnPage(UPAGE.page + 1);
}
function turnPage(p) {
  const total = ((USAGE && USAGE.rows) || []).length;
  const pages = Math.max(1, Math.ceil(total / UPAGE.size));
  UPAGE.page = Math.min(Math.max(0, p), pages - 1);
  const tb = document.querySelector('[data-p="usageRows"]');
  if (tb) tb.innerHTML = usageRowsHtml();
  const pg = document.querySelector('[data-p="usagePager"]');
  if (pg) { pg.innerHTML = usagePagerHtml(); wirePager(); }
  PAGER_SIG = pagerSig();
  const sc = tb && tb.closest(".scroll");
  if (sc) sc.scrollTop = 0;
}

function wireUsage() {
  const bind = (id, key) => {
    const el = $(id);
    if (el) el.onchange = () => { UFILTER[key] = el.value; UPAGE.page = 0; loadUsage(true); };
  };
  bind("ufacct", "acct");
  bind("ufmodel", "model");
  bind("ufkey", "key");
  bind("ufstat", "fail");
  const rf = $("urefresh");
  if (rf) rf.onclick = async () => {
    rf.disabled = true;
    rf.classList.add("spin");
    const old = rf.innerHTML;
    rf.innerHTML = ICON("refresh", 14) + "刷新中…";
    await loadUsage(true);
    rf.classList.remove("spin");
    rf.disabled = false;
    rf.innerHTML = old;
  };
  wirePager();
}

function patch() {

  else if (route === "chan") patchChan();
  else if (route === "logs") patchLogs();
  else if (route === "usage") patchUsage();
}

function view() {
  return route === "dash" ? viewDash() : route === "chan" ? viewChan()
    : route === "policy" ? viewPolicy() : route === "usage" ? viewUsage()
    : route === "acct" ? viewAcct() : route === "mail" ? viewMail() : route === "mbox" ? viewMbox()
    : route === "admin" ? viewAdmin() : route === "keys" ? viewSettings() : viewLogs();
}
function render() {

  if (route !== "acct" && ACC_DETAIL) ACC_DETAIL = null;
  $("title").textContent = ROUTES[route];
  $("stitle").textContent = route === "dash" ? "本机号池 · 只监听 127.0.0.1" : "";
  for (const a of $("nav").children) a.className = a.dataset.r === route ? "on" : "";

  $("view").innerHTML = view();
  if (route === "dash") drawSpark();
  if (route === "usage") { wireUsage(); USAGE_SIG = sigUsage(); PAGER_SIG = pagerSig(); if (!USAGE) loadUsage(); }
  if (route === "acct") { wireAcct(); if (!ACC) loadAccounts(); maybeAutoQuota(); }

  if (route === "dash" && !ACC) loadAccounts();
  if (route === "mail") { wireMail(); if (!MAIL) loadMail(); }
  if (route === "mbox") { wireMbox(); if (!MBOX.data && !MBOX.loading && MBOX.email) loadMbox(); }
  if (route === "logs" && !LOGP.lines.length && !LOGP.loading) loadLogs();

  ACC_SIG = accSig(); MAIL_SIG = mailSig(); PATCH_SIG = dataSig();
  renderClaimModal();

  for (const b of document.querySelectorAll("[data-act]")) {
    b.onclick = () => {
      const act = b.dataset.act, v = b.dataset.v, sel = $("pinsel"), mp = $("modepin");
      if (act === "mode") {

        const pin = v === "pinned" ? (mp && mp.value ? mp.value : (S || {}).modelPinned || "") : "";
        post("/proxy/model-mode", { mode: v, pinned: pin });
      } else {
        post("/proxy/policy", { policy: v, pinned: sel && sel.value ? sel.value : null });
      }
    };
  }
  const sel = $("pinsel");
  if (sel) sel.onchange = () => post("/proxy/policy", { policy: "pinned", pinned: sel.value });
  const mp = $("modepin");
  if (mp) mp.onchange = () => post("/proxy/model-mode", { mode: "pinned", pinned: mp.value });
  for (const b of document.querySelectorAll("[data-f]")) {
    b.onclick = () => { chanFilter = b.dataset.f; render(); };
  }
  for (const b of document.querySelectorAll("[data-mm]")) {
    b.onclick = () => post("/proxy/model-map", { from: b.dataset.mm, to: "" });
  }
  const mma = document.querySelector("[data-mmadd]");
  if (mma) mma.onclick = () => {
    const f = ($("mfrom") || {}).value || "", t = ($("mto") || {}).value || "";
    if (!f.trim() || !t.trim()) { alert("两头都要填"); return; }
    post("/proxy/model-map", { from: f.trim(), to: t.trim() });
  };
  for (const b of document.querySelectorAll("[data-bind]")) {
    b.onclick = () => post("/proxy/bind", { bind: b.dataset.bind });
  }
  for (const b of document.querySelectorAll("[data-keydel]")) {
    b.onclick = () => post("/proxy/key-del", { key: b.dataset.keydel });
  }
  for (const b of document.querySelectorAll("[data-set]")) {
    b.onclick = () => {
      const k = b.dataset.set;
      if (k === "external") post("/proxy/external", { on: b.dataset.v === "1" });
      else if (k === "port") post("/proxy/port", { port: Number(($("portin") || {}).value || 0) });
      else if (k === "refresh-quota") { b.disabled = true; b.textContent = "刷新中…"; post("/proxy/refresh-quota", {}); }
      else if (k === "keyadd") { b.disabled = true; b.textContent = "…"; post("/proxy/key-add", { key: (($("keyin") || {}).value || "").trim() }); }
    };
  }
  for (const b of document.querySelectorAll("[data-probe]")) {
    b.onclick = () => { b.disabled = true; b.textContent = "…"; post("/proxy/probe", { id: b.dataset.probe }); };
  }
  for (const b of document.querySelectorAll("[data-unfreeze]")) {
    b.onclick = () => post("/proxy/unfreeze", { id: b.dataset.unfreeze });
  }
  const pa = $("probeall");
  if (pa) pa.onclick = () => { pa.disabled = true; pa.textContent = "探测中…"; post("/proxy/probe", {}); };

  for (const b of document.querySelectorAll("[data-copy]")) {
    b.onclick = () => navigator.clipboard.writeText(b.dataset.copy)
      .then(() => { b.textContent = "已复制"; setTimeout(() => (b.textContent = "复制"), 1200); }).catch(() => {});
  }
  const all = $("all");
  if (all) all.onchange = () => { showAll = all.checked; render(); };
  wireLogPager();
}

$("nav").onclick = (e) => {
  const a = e.target.closest("a[data-r]");
  if (!a) return;
  route = a.dataset.r;
  location.hash = "#" + route;
  render();
};
window.addEventListener("hashchange", () => {
  const r = location.hash.slice(1);
  if (ROUTES[r] && r !== route) { route = r; render(); }
});

async function post(url, body) {
  try {
    const r = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json();
    if (d && d.error) { alert("改不了：" + d.error); return; }
    S = d.status || d;
    if (d.key) { try { navigator.clipboard.writeText(d.key); } catch (e) {} alert("新 Key（已复制）：\n\n" + d.key); }
    render();
  } catch (e) { alert("失败：" + e.message); }
}

async function tick() {
  if (document.hidden) return;
  try {
    S = await fetch("/proxy/status", { cache: "no-store" }).then((r) => r.json());
    fails = 0; tickN++;
    if (tickN === 1) rep("status-ok", "keys=" + Object.keys(S).length);
    HIST.push(S.tps || 0);
    while (HIST.length > 60) HIST.shift();

    $("sdot2").className = "dot" + (S.external ? " on" : "");
    $("sfoot").textContent = (S.external ? "运行中" : "已关闭") + " · :" + S.port;
    $("ldot").className = "dot" + (S.generating ? " on live" : S.external ? " on" : "");
    $("ltext").textContent = S.generating ? "正在生成" : S.external ? "空闲" : "已停止";
    $("live").className = "pill" + (S.generating ? " live" : "");
    if (tickN === 1) rep("pre-render", "ok");

    patch();

    if (!isEditing()) {

      if (route === "logs") loadLogs();

      if (route === "dash" && (tickN % 5 === 1 || !STATS)) loadStats();

      if (route === "acct" && tickN % 5 === 1) loadAccounts(true);
      if (route === "mail" && tickN % 5 === 1) loadMail(true);

      if (!PATCHED[route] && dataSig() !== PATCH_SIG) render();
    }

    if (route === "usage" && !USAGE_BUSY) {
      USAGE_BUSY = true;
      loadUsage().finally(() => { USAGE_BUSY = false; });
    }
    if (tickN === 1) rep("post-render", "ok");
  } catch (e) {
    rep("tick-throw", (e && (e.stack || e.message)) || e);
    if (++fails > 2) { $("ltext").textContent = "连不上"; $("sfoot").textContent = "连不上"; }
  }
}
render();   
tick();
setInterval(tick, 2000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
</script>
</body>
</html>
