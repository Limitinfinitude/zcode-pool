<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Z·POOL 对话</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0e1116; color:#e8edf5; height:100vh; display:flex; flex-direction:column;
         font:14px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  header { display:flex; gap:10px; align-items:center; padding:10px 16px; border-bottom:1px solid #1b212c;
           flex:none; }
  header b { font-weight:600; font-size:13px; letter-spacing:.3px; }
  select,button { background:#161c26; color:#e8edf5; border:1px solid #252e3d; border-radius:7px;
                  padding:6px 10px; font-size:13px; font-family:inherit; cursor:pointer; }
  button.primary { background:#2866d9; border-color:#2866d9; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  #who { margin-left:auto; font-size:12px; color:#8d9aad; font-variant-numeric:tabular-nums; }
  #log { flex:1; overflow-y:auto; padding:22px 16px 8px; }
  .wrap { max-width:820px; margin:0 auto; }
  .m { margin-bottom:18px; display:flex; gap:12px; }
  .m .who { flex:none; width:52px; font-size:11px; color:#7d8a9d; padding-top:3px; text-align:right; }
  .m .body { flex:1; min-width:0; }
  .m .txt { white-space:pre-wrap; word-break:break-word;
            font-family:ui-monospace,"Cascadia Mono",Consolas,monospace; font-size:13.5px; }
  .m.u .txt { color:#cfe0ff; }
  .m.err .txt { color:#ff929b; font-size:12.5px; }
  .m .meta { font-size:11px; color:#67d3a5; margin-top:8px; font-family:inherit; }
  .m .meta.bad { color:#ff929b; }
  /* 思考过程：默认折叠成一行，点开看全文 */
  .think { margin-bottom:8px; font-size:12px; color:#7f8da1; }
  .think summary { cursor:pointer; color:#8d9aad; list-style:none; user-select:none; }
  .think summary::-webkit-details-marker { display:none; }
  .think summary::before { content:"▸ "; color:#5d6b80; }
  .think[open] summary::before { content:"▾ "; }
  .think .inner { white-space:pre-wrap; word-break:break-word; padding:6px 0 0 14px;
                  border-left:2px solid #232c3a; margin-left:2px; max-height:280px; overflow-y:auto; }
  .cursor::after { content:"▍"; color:#2866d9; animation:bl .9s steps(1) infinite; }
  @keyframes bl { 50% { opacity:0; } }
  footer { flex:none; padding:10px 16px 16px; border-top:1px solid #1b212c; }
  .inbox { max-width:820px; margin:0 auto; display:flex; gap:10px; align-items:flex-end; }
  textarea { flex:1; background:#141a24; color:#e8edf5; border:1px solid #252e3d; border-radius:9px;
             padding:10px 12px; font:13.5px/1.6 ui-monospace,"Cascadia Mono",Consolas,monospace;
             resize:none; height:70px; outline:none; }
  textarea:focus { border-color:#2f4a7d; }
  .hint { max-width:820px; margin:8px auto 0; font-size:11px; color:#6b7787; }
</style>
</head>
<body>
<header>
  <b>Z·POOL</b>
  <select id="model"></select>
  <button id="reset">新会话</button>
  <a id="adm" href="/proxy" style="color:#8d9aad;font-size:12px;text-decoration:none;border:1px solid #252e3d;border-radius:7px;padding:6px 10px">控制台</a>
  <span id="who">…</span>
</header>
<div id="log"><div class="wrap" id="msgs"></div></div>
<footer>
  <div class="inbox">
    <textarea id="in" placeholder="回车发送，Shift+回车换行"></textarea>
    <button class="primary" id="send">发送</button>
    <button id="stop" hidden>停止</button>
  </div>
  <div class="hint" id="hint">走本机反代，用号池的额度。开到「控制台」看当前路由和取码状态。</div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const msgs = $("msgs");
let history = [];
let busy = false;
let abort = null;

// 出什么错都回传一份给服务端日志，不用开 F12 也能看到
function report(kind, detail) {
  try {
    fetch("/client-log", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ kind, detail: String(detail).slice(0, 500) }) });
  } catch (e) {}
}
window.onerror = (m, s, l) => report("onerror", m + " @line " + l);
window.addEventListener("unhandledrejection",
  (e) => report("reject", (e.reason && (e.reason.message || e.reason)) || "?"));
report("loaded", location.href);

(async function init() {
  const s = await fetch("/proxy/status").then(r => r.json()).catch(() => null);
  if (!s) { $("who").textContent = "反代没响应"; report("init", "/proxy/status 拿不到"); return; }
  $("model").innerHTML = s.models.map(m => `<option>${m}</option>`).join("");
  $("who").textContent = "号池 " + s.accounts.length + " · 路由 " + (s.routing || "-");
  $("hint").textContent = "账户：" + s.accounts.slice(0, 6).join(" ") + (s.accounts.length > 6 ? " …" : "");
  report("init", "就绪 路由=" + s.routing);
})();

function bubble(cls, who) {
  const el = document.createElement("div");
  el.className = "m " + cls;
  el.innerHTML = `<div class="who">${who}</div><div class="body">
      <details class="think" hidden><summary></summary><div class="inner"></div></details>
      <div class="txt"></div><div class="meta"></div></div>`;
  msgs.appendChild(el);
  return {
    el,
    txt: el.querySelector(".txt"),
    meta: el.querySelector(".meta"),
    think: el.querySelector(".think"),
    inner: el.querySelector(".inner"),
    summary: el.querySelector("summary"),
  };
}

function scroll() { $("log").scrollTop = $("log").scrollHeight; }

async function send() {
  const text = $("in").value.trim();
  if (!text || busy) return;
  busy = true; $("send").disabled = true; $("stop").hidden = false; $("in").value = "";
  bubble("u", "你").txt.textContent = text;
  history.push({ role: "user", content: text });

  const b = bubble("a", "助手");
  const t0 = performance.now();
  let think = "", acc = "", usage = null, raw = "";
  const model = $("model").value;

  // 实时计时 + 状态，免得看着空屏以为卡死
  let phase = "等待上游…";
  const tick = setInterval(() => {
    const s = ((performance.now() - t0) / 1000).toFixed(1);
    b.meta.textContent = phase + " · " + s + "s";
  }, 200);
  b.txt.classList.add("cursor");

  abort = new AbortController();
  try {
    const r = await fetch("/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json" },
      signal: abort.signal,
      body: JSON.stringify({ model, max_tokens: 8192, stream: true, messages: history }),
    });
    if (!r.ok || !(r.headers.get("content-type") || "").includes("event-stream")) {
      raw = await r.text();
      throw new Error("HTTP " + r.status + "\n" + raw.slice(0, 600));
    }
    phase = "连接已建立，等待模型…";

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n");
      buf = parts.pop();
      for (const line of parts) {
        if (!line.startsWith("data:")) continue;
        const s = line.slice(5).trim();
        if (!s || s === "[DONE]") continue;
        let ev; try { ev = JSON.parse(s); } catch (e) { continue; }
        if (ev.type === "content_block_delta" && ev.delta) {
          const d = ev.delta;
          if (d.type === "thinking_delta" && d.thinking) {
            think += d.thinking;
            b.think.hidden = false;
            b.think.open = !acc;                 // 正文一出来就自动折叠
            b.inner.textContent = think;
            b.summary.textContent = acc ? "思考过程（点开看）" : "思考中…";
            if (!acc) phase = "思考中…";
            scroll();
          } else if (d.type === "text_delta" && d.text) {
            acc += d.text;
            b.txt.textContent = acc;
            phase = "回复中…";
            scroll();
          }
        } else if (ev.type === "message_delta" && ev.usage) {
          usage = ev.usage;
        } else if (ev.type === "error") {
          acc += "\n[上游错误] " + JSON.stringify(ev.error);
          b.txt.textContent = acc;
        }
      }
    }
    b.txt.classList.remove("cursor");
    if (acc && think) { b.think.open = false; b.summary.textContent = "思考过程（点开看）"; }
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    b.meta.textContent = `${r.headers.get("x-relay-account") || "?"} · `
      + `${r.headers.get("x-relay-note") || ""} · ${secs}s`
      + (usage ? ` · in ${usage.input_tokens} out ${usage.output_tokens}` : "");
    history.push({ role: "assistant", content: acc });
  } catch (e) {
    b.txt.classList.remove("cursor");
    if (e.name === "AbortError") {
      b.meta.textContent = "已停止";
      if (acc) history.push({ role: "assistant", content: acc });
    } else {
      b.el.className = "m err";
      b.txt.textContent = String(e.message || e);
      b.meta.className = "meta bad";
      b.meta.textContent = "";
      history.pop();                            // 失败的这轮不进历史
      report("send-fail", e.message || String(e));
    }
  } finally {
    clearInterval(tick);
    abort = null;
    busy = false; $("send").disabled = false; $("stop").hidden = true; scroll(); $("in").focus();
  }
}

$("send").onclick = send;
$("stop").onclick = () => { if (abort) abort.abort(); };
$("in").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("reset").onclick = () => { history = []; msgs.innerHTML = ""; };
$("in").focus();
</script>
</body>
</html>
