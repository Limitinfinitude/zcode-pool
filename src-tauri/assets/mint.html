<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>取码</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#111419; color:#edf1f7; padding:16px 18px; font-size:13px; line-height:1.75;
         font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  .row { display:flex; gap:14px; align-items:baseline; }
  .k { color:#8d9aad; width:76px; flex:none; }
  .v { font-variant-numeric:tabular-nums; }
  .ok { color:#72d9ab; } .err { color:#ff929b; } .dim { color:#7f8da1; font-size:11.5px; }
  #bar { height:3px; background:#1d2330; border-radius:2px; overflow:hidden; margin:12px 0 14px; }
  #bar i { display:block; height:100%; width:0; background:#2866d9; transition:width .2s; }
  .tip { font-size:11.5px; color:#7f8da1; border-top:1px solid #1d2330; padding-top:10px; margin-top:6px; }
</style>
</head>
<body>
<div class="row"><span class="k">状态</span><span class="v" id="st">加载中…</span></div>
<div class="row"><span class="k">码池</span><span class="v" id="pool">-</span></div>
<div class="row"><span class="k">累计取码</span><span class="v" id="hits">0</span></div>
<div class="row"><span class="k">最近一次</span><span class="v dim" id="last">-</span></div>
<div id="bar"><i></i></div>
<div class="tip">这个窗口<b>别关</b>（最小化没关系）。中继需要验证码时来这里现取一个 —— 验证码是现场生成的、
一次性、服务端不给长期票据，只能开着这个窗口取。没有请求时它不会取。</div>

<div id="holder"></div>
<button id="go" style="opacity:0;width:1px;height:1px;padding:0;border:0;overflow:hidden">取码</button>
<script src="https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js">
</script>
<script>const $ = (id) => document.getElementById(id);

const rep = (kind, detail) => {
  try {
    fetch("/client-log", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ kind: "mint:" + kind, detail: String(detail).slice(0, 400) }) });
  } catch (e) {}
};
window.onerror = (m, src, l) => rep("onerror", m + " @line " + l);
window.addEventListener("unhandledrejection", (e) => rep("reject", (e.reason && (e.reason.message || e.reason)) || "?"));

function envProbe() {
  const holder = $("holder");
  const r = holder ? holder.getBoundingClientRect() : { width: 0, height: 0 };
  return [
    "vis=" + document.visibilityState,
    "focus=" + document.hasFocus(),
    "vp=" + window.innerWidth + "x" + window.innerHeight,
    "holder=" + Math.round(r.width) + "x" + Math.round(r.height),
    "sdk=" + (typeof window.initAliyunCaptcha),
  ].join(" ");
}
const setSt = (t, cls) => { $("st").className = "v " + (cls || ""); $("st").textContent = t; };

const CFG = { region: "cn", prefix: "no8xfe", sceneId: "11xygtvd" };

let resolveNext = null, busy = false, hits = 0;

const b64id = (p) => { try { return JSON.parse(atob(p)).certifyId || "?"; } catch (e) { return "?"; } };

function mintOnce(timeoutMs = 20000) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (v) => {
      if (done) return;
      done = true; clearTimeout(timer); resolveNext = null;
      try { $("holder").replaceChildren(); } catch (e) {}
      resolve(v);
    };
    rep("mintOnce", "开始 " + envProbe());
    const timer = setTimeout(() => { rep("timeout", "20 秒没出码"); finish(null); }, timeoutMs);
    resolveNext = (p) => finish(p);

    window.AliyunCaptchaConfig = { region: CFG.region, prefix: CFG.prefix };
    try {
      window.initAliyunCaptcha({
        SceneId: CFG.sceneId, mode: "popup", language: "zh-CN", showErrorTip: false,
        element: "#holder", button: "#go",
        getInstance: (inst) => {
          if (typeof inst.startTracelessVerification === "function") {
            try { inst.startTracelessVerification(); } catch (e) { finish(null); }
          } else { finish(null); }
        },
        success: (param) => {
          const p = typeof param === "string" ? param : (param && param.captchaVerifyParam);
          rep("sdk-success", p ? "长度 " + p.length : "空参数");
          if (p && resolveNext) resolveNext(p);
        },
        fail: (code) => rep("sdk-fail", JSON.stringify(code)),   
        onError: (code, msg) => rep("sdk-error", code + " " + msg),
      });
    } catch (e) { rep("init-throw", e.message || e); finish(null); }
  });
}

async function tick() {

  const s = await fetch("/want-mint?wait=1").then((r) => r.json()).catch(() => null);
  if (!s) {
    setSt("连不上中继，2 秒后重试", "err");
    await new Promise((r) => setTimeout(r, 2000));
    return tick();
  }
  if (hits < 3 && window.__tickN === undefined) window.__tickN = 0;
  if (window.__tickN !== undefined && window.__tickN < 5) {
    window.__tickN++;
    rep("want", "pool=" + s.pool + " target=" + s.target + " want=" + s.want);
  }
  $("pool").textContent = s.pool + " / " + s.target;
  $("bar").firstElementChild.style.width = Math.min(100, s.pool / Math.max(1, s.target) * 100) + "%";

  if (s.want && !busy) {
    busy = true; setSt("取码中…");
    const t0 = Date.now();
    const param = await mintOnce();
    if (param) {
      await fetch("/mint-result", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ param, region: CFG.region, certifyId: b64id(param) }),
      }).catch(() => {});
      hits++; $("hits").textContent = hits;
      $("last").textContent = new Date().toLocaleTimeString()
        + "  " + b64id(param) + "  " + ((Date.now() - t0) / 1000).toFixed(1) + "s";
      setSt("待命", "ok");
    } else {
      setSt("这次没取到，下一轮重试", "err");
    }
    busy = false;
  }
  tick();
}

rep("loaded", envProbe());
setSt("待命", "ok");
tick();
</script>
</body>
</html>
