name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target: ''
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - name: Build & attach to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2.2' }}
          releaseName: 'Z·POOL ${{ github.ref_name }}'
          releaseBody: |
            本版修复 / 改进

            - **模型请求不再需要验证码**：上游已关闭该校验（实测带与不带都通，速度无可测差异）。取码池随之停产 —— 不再按次计费，也少一条「池空」的失败路径。领取套餐用的验证码不受影响。
            - **反代可配出站代理**：设置里新增「出站代理」。反代的请求本来不读系统代理、只能靠全局 TUN 抓流量，现在填一个 http / socks5 代理即可，不必常开 TUN。
            - **修「领取成功却没反馈」**：结果里的时间戳是给人看的字符串，前端拿它和数字比会得到 NaN，成功分支永远进不去 —— 改成数值时间戳，弹窗现在会显示「已领取：xxx」。
            - **修监听端口偶发变 8899**：启动时读了两次设置，两次之间文件若被原子替换会读失败并静默回默认值；改成只读一次 + 读失败重试 + 失败时写日志。
            - **对外冒充的客户端版本改为自动读取**：从 ZCode 安装的 exe 版本资源里读，读不到才退回常量，客户端升级后不用再改代码。
            - **修「可领套餐」弹窗里的「领取」按钮点了没反应**（按钮生成晚于事件绑定）。

            下载：Windows `*_x64-setup.exe` · macOS `*_universal.dmg` · Linux `*.deb` / `*.AppImage`

            程序未签名，首次运行系统可能提示来源未知。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} ', matrix.target) || '' }}--bundles ${{ matrix.bundles }}
