name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target: ''
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - name: Build & attach to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2.0' }}
          releaseName: 'Z·POOL v0.2.0'
          releaseBody: |
            Z·POOL — 邮箱池 / Z.ai 批量注册验证 / ZCode 账号切换 / **带 Web 管理台的 proxy 网关**。

            本版重点：**反代 + 管理台**

            - **proxy 网关**：对外提供 Anthropic 协议接口（默认 `http://127.0.0.1:8899/v1/messages`），
              pi-agent、LobeChat、Claude SDK 这类客户端填上就能直接用上账号池的额度。
            - **Web 管理台**：浏览器打开 `http://127.0.0.1:8899/proxy` 即可操作，改页面不用重编译。
              仪表盘 / 渠道 / 使用记录 / 账号 / 邮箱 / 设置 / 日志七个页面。
            - **带一个对话页**（`http://127.0.0.1:8899/`），用来直接验证反代通不通，支持流式输出与思考过程折叠。
            - **反代开关 / 监听地址 / 端口 / API Key / 选号策略 / 模型策略 / 模型映射**，都能在管理台里改，不用回桌面面板。
            - **监听地址可切到局域网**：切到非本机地址时**强制要求先建 API Key**，否则同网段的人能烧你的额度。
              鉴权规则是「本机回环免验，外部必须带 Key」。
            - **模型策略**：`自动回退`（请求的模型全库没额度时换一个还有额度的）/ `指定模型`（锁死一个，用完也不换）。
            - **额度缓存落盘**：额度不再只活在内存里，重启不用从零再查一遍。
            - **验证码自动生成**：上游要求每个请求带一次性验证码参数，由工具在后台持续取，不用管。

            其它
            - 使用记录：今日 / 累计 Token（输入、输出、缓存分列），按模型 / 账号 / Key 分组，可筛选可翻页。
            - 渠道页：一行一个号，含整池延迟汇总（平均 / 中位数 / P95）与近况迷你图。
            - 账号页：一行一个号、状态与名字筛选分页、额度环形仪表盘、今天到期的额度。

            ⚠️ **「无感切换」仍然没有**，也不会再加
            - 实测：**同一个对话被超过 2 个账号使用过就会触发上游风控（`3012`）**，此后这条对话用任何账号都过不去。
            - 换号请用账号库里的**手动切换**：存档当前登录 → 切换 → 自动拉起客户端，以新身份开始新对话。

            下载对应平台：
            - Windows: `*_x64-setup.exe`（安装包）
            - macOS: `*_universal.dmg`（Intel + Apple Silicon）
            - Linux: `*.deb` / `*.AppImage`

            未签名，首次运行系统可能提示「未知开发者」。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} ', matrix.target) || '' }}--bundles ${{ matrix.bundles }}
