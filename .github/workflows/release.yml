# 跨平台构建：推 tag（v*）或手动触发时，在 win / mac / linux 上分别打包，
# 并把产物挂到 GitHub Release。
#
# 为什么要 CI：macOS 应用必须在 macOS 上构建（无法从 Windows 交叉编译），
# 所以 mac 版由 GitHub 的 macos runner 产出。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target: ''
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - name: Build & attach to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          releaseName: 'Z·POOL v0.1.0'
          releaseBody: |
            Z·POOL v0.1.0 — 邮箱池 / Z.ai 批量注册验证 / ZCode 账号切换。

            下载对应平台：
            - Windows: `*_x64-setup.exe`（安装包）
            - macOS: `*_universal.dmg`（Intel + Apple Silicon）
            - Linux: `*.deb` / `*.AppImage`

            未签名，首次运行系统可能提示「未知开发者」。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} ', matrix.target) || '' }}--bundles ${{ matrix.bundles }}
