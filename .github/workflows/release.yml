name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target: ''
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - name: Build & attach to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2.3' }}
          releaseName: 'Z·POOL ${{ github.ref_name }}'
          releaseBody: |
            本版修复 / 改进

            - **系统提示词精简 84%**：上游只校验提示词的**开头**（从第 0 个字节逐字节比对到身份段末尾为止），
              后面的段落可有可无。现在只发必需的两块，**7814 → 1253 字符**。
              - **不再把本机路径写进每一次请求** —— 原先固定带上 `# Environment` 段，
                含 `C:\Users\<用户名>\.zcode\workspace\default`。
              - 去掉了客户端专属的 `::code-comment` 指令、`/<skill-name>` 走 Skill 工具等段落 ——
                第三方客户端不认这些，模型照着吐出来就是幻觉。
              - 上游实测仍为 **200**，行为不受影响。

            下载：Windows `*_x64-setup.exe` · macOS `*_universal.dmg` · Linux `*.deb` / `*.AppImage`

            程序未签名，首次运行系统可能提示来源未知。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} ', matrix.target) || '' }}--bundles ${{ matrix.bundles }}
